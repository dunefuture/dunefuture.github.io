name: Championship CLOSED integration checks

on:
  pull_request:
    paths:
      - 'championship.html'
      - 'championship-account-preview.html'
      - 'championship-public.json'
      - 'tests/championship-closed.test.mjs'
      - '.github/workflows/championship-closed-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closed-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out review source
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Verify CLOSED preview and public roster contracts
        run: node --test tests/championship-closed.test.mjs
